name: Validate

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main

jobs:
  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
          ignore: brands

  lint:
    name: Ruff Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install ruff
      - run: ruff check custom_components/pytap/ tests/ scripts/

  tests:
    name: HA ${{ matrix.core }} (${{ matrix.suite }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - core: "2026.10.4"
            suite: full
          - core: "2026.11.2"
            suite: smoke
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install Core under official constraints
        run: |
          curl --fail --silent --show-error --location \
            "https://raw.githubusercontent.com/home-assistant/core/${{ matrix.core }}/homeassistant/package_constraints.txt" \
            --output "$RUNNER_TEMP/ha-constraints.txt"
          python -m pip install -c "$RUNNER_TEMP/ha-constraints.txt" \
            "homeassistant==${{ matrix.core }}" pydantic
      - name: Install minimum-Core test harness
        if: matrix.suite == 'full'
        run: python -m pip install -c "$RUNNER_TEMP/ha-constraints.txt" -r requirements-test.txt
      - name: Install manifest closure and verify real public APIs
        run: python scripts/prepare_ha_tests.py --constraints "$RUNNER_TEMP/ha-constraints.txt"
      - name: Verify exact rollback baseline
        run: |
          git fetch origin a80698fca67bef4847a3c6ce5217f163fee94c01
          git cat-file -e 'a80698fca67bef4847a3c6ce5217f163fee94c01^{commit}'
      - name: Integration tests
        if: matrix.suite == 'full'
        run: python -m pytest tests/ -vv --tb=short
      - name: Parser library tests
        if: matrix.suite == 'full'
        env:
          PYTHONPATH: custom_components/pytap
        run: python -c 'import pytap, pytest; raise SystemExit(pytest.main(["custom_components/pytap/pytap/tests/", "--import-mode=importlib", "-vv"]))'
      - name: Supported-Core smoke and rollback (zero skips)
        run: python scripts/run_core_smoke.py
